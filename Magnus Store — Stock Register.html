<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8234B">
<title>Magnus Store — Stock Register</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--paper:#F5F6F9;--sheet:#FFFFFF;--rule:#E4E1EA;--carmine:#C8234B;--carmine-soft:#FBE6EC;--ink:#1F3A93;--ink-soft:#E7ECFA;--text:#1C1B22;--muted:#6B6878;--in:#1E7B55;--in-soft:#E2F4EC;--out:#B4262F;--out-soft:#FBE4E5;--warn:#B45309;--warn-soft:#FDF1DF;--shadow:0 -1px 0 var(--rule)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131218;--sheet:#1C1B23;--rule:#2F2D3A;--carmine:#F0567A;--carmine-soft:#3A1E28;--ink:#8FA8F5;--ink-soft:#232B45;--text:#ECEAF2;--muted:#9C99AA;--in:#5CC99A;--in-soft:#173327;--out:#F07A80;--out-soft:#3A1C1F;--warn:#F2A541;--warn-soft:#3A2B17}}
:root[data-theme="dark"]{--paper:#131218;--sheet:#1C1B23;--rule:#2F2D3A;--carmine:#F0567A;--carmine-soft:#3A1E28;--ink:#8FA8F5;--ink-soft:#232B45;--text:#ECEAF2;--muted:#9C99AA;--in:#5CC99A;--in-soft:#173327;--out:#F07A80;--out-soft:#3A1C1F;--warn:#F2A541;--warn-soft:#3A2B17}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--carmine);color:#fff;padding:12px 16px 10px}
header.top h1{margin:0;font-size:1.1rem;font-weight:700}
header.top p{margin:2px 0 0;font-size:.78rem;opacity:.9}
.sync{float:right;font-size:.72rem;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:.74rem;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--carmine);font-weight:700}
.view{display:none}.view.on{display:block}
h2{font-size:1.05rem;margin:18px 0 8px}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:9px 10px}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.72rem;color:var(--muted)}
.stat.warn b{color:var(--warn)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--text)}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;min-height:46px}
.btn.full{width:100%}.btn.ghost{background:var(--ink-soft);color:var(--ink)}.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.in{background:var(--in)}.btn.out{background:var(--out)}.btn.small{padding:7px 12px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
.it:last-child{border-bottom:0}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm span{font-size:.75rem;color:var(--muted)}
.it .q{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .q b{font-size:1.05rem}.it .q span{font-size:.75rem;color:var(--muted);margin-left:3px}
.low .q b{color:var(--warn)}.neg .q b{color:var(--out)}
.tag{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.low{background:var(--warn-soft);color:var(--warn)}.tag.in{background:var(--in-soft);color:var(--in)}.tag.out{background:var(--out-soft);color:var(--out)}.tag.adj{background:var(--ink-soft);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;border-radius:9px;padding:11px 4px;font:inherit;font-weight:600;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:.72rem}
.seg button[aria-pressed="true"].in{background:var(--in);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--out);color:#fff}
.seg button[aria-pressed="true"].adj{background:var(--ink);color:#fff}
.picker{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:4;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.sugg.on{display:block}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;color:var(--text);font:inherit;padding:11px 12px;text-align:left;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.sugg button.new{color:var(--ink);font-weight:600}
.selinfo{margin-top:6px;font-size:.85rem;color:var(--muted);min-height:1.2em}
.selinfo b{color:var(--text)}
.qtywrap{display:flex;align-items:stretch;gap:8px}
.qtywrap input{flex:1;font-size:1.3rem;font-weight:700;text-align:center}
.unit{display:flex;align-items:center;justify-content:center;min-width:64px;background:var(--ink-soft);color:var(--ink);border-radius:10px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px;margin-top:8px}
.quick button{flex:1 1 auto;border:1px solid var(--rule);background:var(--sheet);color:var(--text);border-radius:8px;padding:7px 0;font:inherit;font-size:.85rem;cursor:pointer;min-width:52px}
.entry{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.entry:last-child{border-bottom:0}
.entry .nm{flex:1;min-width:0}.entry .nm b{font-weight:600}.entry .nm>span{display:block;font-size:.75rem;color:var(--muted)}
.entry .q{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.entry .q.in{color:var(--in)}.entry .q.out{color:var(--out)}.entry .q.adj{color:var(--ink)}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:4px 8px;cursor:pointer;line-height:1}
table.reg{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
table.reg th{text-align:right;font-weight:600;color:var(--muted);font-size:.72rem;padding:8px 4px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet)}
table.reg th:first-child,table.reg td:first-child{text-align:left}
table.reg td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--rule)}
table.reg td.i{color:var(--in)}table.reg td.o{color:var(--out)}
table.reg td b{font-weight:700}
.scroll{overflow-x:auto}
.menu .it{padding:14px 12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sheet .hd h3{margin:0;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
.note{background:var(--warn-soft);color:var(--text);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.note.info{background:var(--ink-soft)}
.prev{max-height:300px;overflow:auto;margin:10px 0}
.opgrid .it{cursor:default}
.opgrid input{width:88px;text-align:right;padding:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head>
<body>
<header class="top"><span class="sync" id="sync">Loading…</span><h1>Magnus Store</h1><p id="hdrsub">Stock register</p></header>
<main>
<!-- STOCK -->
<section class="view on" id="v-stock" aria-label="Balance stock">
  <div id="setupNote"></div>
  <div class="stats"><div class="stat"><b id="sItems">0</b><span>Items in stock</span></div><div class="stat warn"><b id="sLow">0</b><span>Low / finished</span></div><div class="stat"><b id="sVal">₹0</b><span>Approx. value</span></div></div>
  <input id="stSearch" type="search" placeholder="Search item… (शोधा)" aria-label="Search items">
  <div class="chips" id="stChips" style="margin-top:10px"></div>
  <div class="list" id="stList"></div>
</section>
<!-- ENTRY -->
<section class="view" id="v-entry" aria-label="Add entry">
  <div class="seg" role="group" aria-label="Entry type">
    <button class="in" data-t="in" aria-pressed="true">Stock In<small>आवक · आलेला माल</small></button>
    <button class="out" data-t="out" aria-pressed="false">Issue Out<small>जावक · बाहेर काढला</small></button>
    <button class="adj" data-t="adj" aria-pressed="false">Count<small>मोजणी · प्रत्यक्ष</small></button>
  </div>
  <div class="card">
    <label for="eDate">Date</label>
    <input id="eDate" type="date">
    <label for="eItem">Item</label>
    <div class="picker"><input id="eItem" autocomplete="off" placeholder="Type item name…"><div class="sugg" id="eSugg"></div></div>
    <div class="selinfo" id="eInfo"></div>
    <label for="eQty" id="eQtyLbl">Quantity received</label>
    <div class="qtywrap"><input id="eQty" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><div class="unit" id="eUnit">—</div></div>
    <div class="quick" id="eQuick"></div>
    <label for="eNote" id="eNoteLbl">Note (supplier / bill no.)</label>
    <input id="eNote" placeholder="Optional">
    <div style="margin-top:14px"><button class="btn full in" id="eSave">Save entry</button></div>
  </div>
  <h2 id="dayTitle">Entries today</h2>
  <div class="list" id="dayList"></div>
</section>
<!-- REGISTER -->
<section class="view" id="v-reg" aria-label="Daily register">
  <div class="card">
    <div class="row"><div><label for="rFrom">From</label><input id="rFrom" type="date"></div><div><label for="rTo">To</label><input id="rTo" type="date"></div></div>
    <div class="row" style="margin-top:10px"><select id="rMode" aria-label="Show"><option value="moved">Only items that moved</option><option value="all">All items</option><option value="low">Low stock only</option></select></div>
    <div class="quick" style="margin-top:10px"><button data-r="today">Today</button><button data-r="yest">Yesterday</button><button data-r="week">This week</button><button data-r="month">This month</button></div>
  </div>
  <div class="stats"><div class="stat"><b id="rIn" style="color:var(--in)">0</b><span>In entries</span></div><div class="stat"><b id="rOut" style="color:var(--out)">0</b><span>Out entries</span></div><div class="stat"><b id="rN">0</b><span>Items shown</span></div></div>
  <div class="card scroll" style="padding:6px 8px"><table class="reg" id="rTable"></table></div>
  <button class="btn ghost full" id="rCsv">Download this register (CSV)</button>
</section>
<!-- MORE -->
<section class="view" id="v-more" aria-label="Setup">
  <h2>Setup</h2>
  <div class="list menu">
    <button class="it" data-open="opening"><span class="nm"><b>Opening stock</b><span id="opInfo">Set starting balance (सुरुवातीचा स्टॉक)</span></span><span class="q">›</span></button>
    <button class="it" data-open="paste"><span class="nm"><b>Paste a list</b><span>Opening stock or a delivery, many items at once</span></span><span class="q">›</span></button>
    <button class="it" data-open="items"><span class="nm"><b>Items &amp; units</b><span id="itInfo">Add, rename, set minimum level</span></span><span class="q">›</span></button>
  </div>
  <h2>Backup</h2>
  <div class="list menu">
    <button class="it" id="mBal"><span class="nm"><b>Download balance stock (CSV)</b><span>Opens in Excel</span></span><span class="q">↓</span></button>
    <button class="it" id="mBak"><span class="nm"><b>Download full backup</b><span>All items and entries (.json)</span></span><span class="q">↓</span></button>
    <button class="it" id="mShare"><span class="nm"><b>Send backup to WhatsApp / Drive / Email</b><span id="bakInfo">No backup taken yet</span></span><span class="q">↗</span></button>
    <button class="it" id="mCopy"><span class="nm"><b>Copy backup as text</b><span>Paste it in WhatsApp "Message yourself" or Google Keep</span></span><span class="q">⧉</span></button>
    <button class="it" id="mRes"><span class="nm"><b>Restore from backup</b><span>From a file or pasted text — replaces what is here now</span></span><span class="q">↑</span></button>
  </div>
  <input type="file" id="resFile" accept=".json,application/json" hidden>
  <p class="small muted" id="storeInfo" style="margin-top:14px"></p>
</section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-v="stock" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>Stock</button>
  <button role="tab" data-v="entry" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Entry</button>
  <button role="tab" data-v="reg" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Register</button>
  <button role="tab" data-v="more" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Setup</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

const LS="magnus-store-v1";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtD=s=>{if(!s)return"";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};
const num=v=>{const n=Math.round(v*1000)/1000;return n.toLocaleString("en-IN",{maximumFractionDigits:3})};
const inr=v=>"₹"+Math.round(v).toLocaleString("en-IN");
const slug=s=>s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||("i"+Date.now());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2200)}

/* ---------- state ---------- */
let S={items:[],opening:{date:"",qty:{}},days:{}};
let db=null, mode="local";
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);S.items=o.items||[];S.opening=o.opening||{date:"",qty:{}};S.days=o.days||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const queues={};
function queueWrite(path,body){
  if(!db)return Promise.resolve();
  const run=()=>db.doc(path).set(body).catch(e=>{if(e&&e.code==="quota_exceeded")toast("Storage full — download a backup");else if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>db.doc(path).set(body)).catch(()=>toast("Could not sync — saved on this phone"));else toast("Could not sync — saved on this phone")});
  queues[path]=(queues[path]||Promise.resolve()).then(run);return queues[path];}
function saveItems(){saveLocal();return queueWrite("store/items",{list:S.items,updated:Date.now()})}
function saveOpening(){saveLocal();return queueWrite("store/opening",{...S.opening,updated:Date.now()})}
function saveDay(d){saveLocal();return queueWrite("store/main/days/"+d,{date:d,entries:(S.days[d]||[]),updated:Date.now()})}

/* ---------- calculations ---------- */
const itemById=id=>S.items.find(i=>i.id===id);
function entriesBetween(from,to){const out=[];for(const d of Object.keys(S.days).sort()){if((!from||d>=from)&&(!to||d<=to))for(const e of S.days[d])out.push({...e,date:d})}return out}
function effQty(e){return e.t==="in"?e.qty:e.t==="out"?-e.qty:e.diff||0}
// balance at end of date `upto` (inclusive); counts from opening date
function balances(upto){const b={};const od=S.opening.date||"0000-00-00";
  for(const [k,v] of Object.entries(S.opening.qty||{}))b[k]=+v||0;
  for(const e of entriesBetween(od,upto)){b[e.item]=(b[e.item]||0)+effQty(e)}
  return b}
function balanceOf(id,upto){return balances(upto)[id]||0}

/* ---------- tabs ---------- */
$$("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){$$("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.v===v));$$(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));window.scrollTo(0,0);if(v==="stock")renderStock();if(v==="reg")renderReg();if(v==="entry")renderDay();if(v==="more")renderMore()}

/* ---------- stock view ---------- */
let stCat="";
function renderStock(){
  const b=balances(today()), q=$("#stSearch").value.trim().toLowerCase();
  let inStock=0,low=0,val=0;
  S.items.forEach(i=>{const v=b[i.id]||0;if(v>0)inStock++;if(isLow(i,v))low++;if(v>0&&i.rate)val+=v*i.rate});
  $("#sItems").textContent=inStock;$("#sLow").textContent=low;$("#sVal").textContent=val>=100000?"₹"+(val/100000).toFixed(2)+"L":inr(val);
  const cats=["","Low stock",...CATS.filter(c=>S.items.some(i=>i.cat===c))];
  $("#stChips").innerHTML=cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===stCat}">${c===""?"All":esc(c)}</button>`).join("");
  $$("#stChips .chip").forEach(x=>x.onclick=()=>{stCat=x.dataset.c;renderStock()});
  let list=S.items.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(stCat===""||(stCat==="Low stock"?isLow(i,b[i.id]||0):i.cat===stCat)));
  list.sort((a,c)=>{const av=b[a.id]||0,cv=b[c.id]||0;const at=S.opening.qty[a.id]!=null||hasMoves(a.id),ct=S.opening.qty[c.id]!=null||hasMoves(c.id);if(at!==ct)return at?-1:1;return a.name.localeCompare(c.name)});
  $("#stList").innerHTML=list.length?list.map(i=>{const v=b[i.id]||0,l=isLow(i,v);return `<button class="it ${v<0?"neg":l?"low":""}" data-id="${esc(i.id)}"><span class="nm"><b>${esc(i.name)}${l?'<span class="tag low">'+(v<=0?"Finished":"Low")+'</span>':""}</b><span>${esc(i.cat||"")}${i.min?` · min ${num(i.min)}`:""}</span></span><span class="q"><b>${num(v)}</b><span>${esc(i.unit)}</span></span></button>`}).join(""):`<div class="empty"><b>No items found</b>Try another name, or add it from Setup → Items.</div>`;
  $$("#stList .it").forEach(x=>x.onclick=()=>openLedger(x.dataset.id));
  const n=$("#setupNote");
  let lb2="";try{lb2=localStorage.getItem(LS+"-bak")||""}catch(e){}
  const hasData=Object.values(S.days).some(a=>a.length);
  if(S.opening.date&&hasData&&(!lb2||lb2<addDays(today(),-7))){n.innerHTML=`<div class="note">${lb2?"Last backup was "+fmtD(lb2)+".":"No backup yet."} Take one now: <button class="btn small" id="nBak" style="margin-left:4px">Send backup</button></div>`;$("#nBak").onclick=()=>$("#mShare").click();return}
  if(!S.opening.date)n.innerHTML=`<div class="note info"><b>Start here:</b> set your opening stock (the closing balance you count) in Setup → Opening stock, or paste the list. After that, add daily Stock In and Issue Out entries.</div>`;else n.innerHTML="";
  $("#hdrsub").textContent=S.opening.date?`Balance as of ${fmtD(today())} · opening ${fmtD(S.opening.date)}`:"Stock register";
}
function hasMoves(id){for(const d in S.days)if(S.days[d].some(e=>e.item===id))return true;return false}
function isLow(i,v){const tracked=S.opening.qty[i.id]!=null||hasMoves(i.id);return tracked&&((i.min>0&&v<=i.min)||v<=0)}
$("#stSearch").addEventListener("input",renderStock);

/* item ledger sheet */
function openLedger(id){const i=itemById(id);if(!i)return;
  const od=S.opening.date;let run=+(S.opening.qty[id]||0);
  const rows=entriesBetween(od||null,null).filter(e=>e.item===id);
  let totIn=0,totOut=0;
  const body=rows.map(e=>{const q=effQty(e);run+=q;if(e.t==="in")totIn+=e.qty;if(e.t==="out")totOut+=e.qty;return `<tr><td>${fmtD(e.date)}<br><span class="tag ${e.t}">${e.t==="in"?"In":e.t==="out"?"Out":"Count"}</span> <span class="muted small">${esc(e.note||"")}</span></td><td class="${q>=0?"i":"o"}">${q>=0?"+":""}${num(q)}</td><td><b>${num(run)}</b></td></tr>`}).reverse().join("");
  openSheet(`<div class="hd"><h3>${esc(i.name)}</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="stats"><div class="stat"><b>${num(run)}</b><span>Balance (${esc(i.unit)})</span></div><div class="stat"><b style="color:var(--in)">${num(totIn)}</b><span>Total in</span></div><div class="stat"><b style="color:var(--out)">${num(totOut)}</b><span>Total out</span></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn in small" data-q="in">+ Stock In</button><button class="btn out small" data-q="out">− Issue Out</button><button class="btn ghost small" data-q="edit">Edit item</button></div>
  <div class="card scroll" style="padding:6px 8px"><table class="reg"><tr><th>Date</th><th>Qty</th><th>Balance</th></tr>${body}<tr><td>${od?fmtD(od):"—"}<br><span class="tag adj">Opening</span></td><td></td><td><b>${num(+(S.opening.qty[id]||0))}</b></td></tr></table></div>`);
  $$("#sheet [data-q]").forEach(b=>b.onclick=()=>{closeSheet();if(b.dataset.q==="edit")return editItem(id);show("entry");setType(b.dataset.q);selectItem(id);$("#eQty").focus()});
}

/* ---------- sheet ---------- */
function openSheet(h){$("#sheet").innerHTML=h;$("#sheetBg").classList.add("on");$$("#sheet [data-close]").forEach(b=>b.onclick=closeSheet)}
function closeSheet(){$("#sheetBg").classList.remove("on")}
$("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")closeSheet()});

/* ---------- entry ---------- */
let eType="in", eSel=null;
$$(".seg button").forEach(b=>b.onclick=()=>setType(b.dataset.t));
function setType(t){eType=t;$$(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  $("#eQtyLbl").textContent=t==="in"?"Quantity received (आलेला)":t==="out"?"Quantity issued (दिलेला)":"Quantity counted in store (प्रत्यक्ष शिल्लक)";
  $("#eNoteLbl").textContent=t==="in"?"Note (supplier / bill no.)":t==="out"?"Note (kitchen / bar / who took it)":"Note (optional)";
  const s=$("#eSave");s.className="btn full "+(t==="adj"?"":t);s.textContent=t==="in"?"Save stock in":t==="out"?"Save issue out":"Save count";
  $("#eQuick").innerHTML=(t==="adj"?[]:[1,2,5,10,25,50]).map(n=>`<button data-n="${n}">+${n}</button>`).join("");
  $$("#eQuick button").forEach(b=>b.onclick=()=>{const q=$("#eQty");q.value=num((+q.value||0)+(+b.dataset.n)).replace(/,/g,"")});
  updInfo()}
const eItem=$("#eItem"),eSugg=$("#eSugg");
eItem.addEventListener("input",()=>{eSel=null;updInfo();suggest()});
eItem.addEventListener("focus",suggest);
document.addEventListener("click",e=>{if(!e.target.closest(".picker"))eSugg.classList.remove("on")});
function suggest(){const q=eItem.value.trim().toLowerCase();const b=balances($("#eDate").value||today());
  let l=S.items.filter(i=>!q||i.name.toLowerCase().includes(q));
  l.sort((a,c)=>{const as=a.name.toLowerCase().startsWith(q)?0:1,cs=c.name.toLowerCase().startsWith(q)?0:1;return as-cs||a.name.localeCompare(c.name)});
  l=l.slice(0,30);
  let h=l.map(i=>`<button data-id="${esc(i.id)}">${esc(i.name)}<span>${num(b[i.id]||0)} ${esc(i.unit)}</span></button>`).join("");
  if(q&&!S.items.some(i=>i.name.toLowerCase()===q))h+=`<button class="new" data-new="1">+ Add "${esc(eItem.value.trim())}" as new item</button>`;
  eSugg.innerHTML=h;eSugg.classList.toggle("on",!!h);
  $$("#eSugg button").forEach(x=>x.onclick=()=>{if(x.dataset.new)return newItemQuick(eItem.value.trim());selectItem(x.dataset.id);eSugg.classList.remove("on");$("#eQty").focus()})}
function selectItem(id){const i=itemById(id);if(!i)return;eSel=id;eItem.value=i.name;updInfo()}
function updInfo(){const i=eSel&&itemById(eSel);$("#eUnit").textContent=i?i.unit:"—";
  if(!i){$("#eInfo").textContent="";return}
  const bal=balanceOf(i.id,$("#eDate").value||today());$("#eInfo").innerHTML=`In store now: <b>${num(bal)} ${esc(i.unit)}</b>${eType==="adj"?" — enter what you actually counted":""}`}
$("#eDate").addEventListener("change",()=>{updInfo();renderDay()});
$("#eSave").onclick=()=>{
  const i=eSel&&itemById(eSel);if(!i){toast("Pick an item from the list");eItem.focus();return}
  const q=parseFloat($("#eQty").value);if(isNaN(q)||q<0||(q===0&&eType!=="adj")){toast("Enter a quantity");$("#eQty").focus();return}
  const d=$("#eDate").value||today();
  if(S.opening.date&&d<S.opening.date){toast("Date is before opening stock date");return}
  const bal=balanceOf(i.id,d);
  if(eType==="out"&&q>bal&&!confirm(`Only ${num(bal)} ${i.unit} of ${i.name} in store. Issue ${num(q)} anyway?`))return;
  const e={id:uid(),t:eType,item:i.id,qty:q,note:$("#eNote").value.trim(),ts:Date.now()};
  if(eType==="adj"){e.counted=q;e.diff=Math.round((q-bal)*1000)/1000;if(e.diff===0){toast("Count matches — nothing to change");return}}
  (S.days[d]=S.days[d]||[]).push(e);saveDay(d);
  toast(eType==="in"?`Added ${num(q)} ${i.unit} ${i.name}`:eType==="out"?`Issued ${num(q)} ${i.unit} ${i.name}`:`Adjusted ${i.name} by ${e.diff>0?"+":""}${num(e.diff)}`);
  eSel=null;eItem.value="";$("#eQty").value="";$("#eNote").value="";updInfo();renderDay();eItem.focus()};
function renderDay(){const d=$("#eDate").value||today();const l=(S.days[d]||[]).slice().reverse();
  $("#dayTitle").textContent=(d===today()?"Entries today":"Entries on "+fmtD(d))+` (${l.length})`;
  $("#dayList").innerHTML=l.length?l.map(e=>{const i=itemById(e.item)||{name:e.item,unit:""};const q=e.t==="adj"?(e.diff>0?"+":"")+num(e.diff):(e.t==="in"?"+":"−")+num(e.qty);
  return `<div class="entry"><span class="nm"><b>${esc(i.name)}</b><span><span class="tag ${e.t}">${e.t==="in"?"In":e.t==="out"?"Out":"Count "+num(e.counted)}</span> ${esc(e.note||"")}</span></span><span class="q ${e.t}">${q} ${esc(i.unit)}</span><button class="x" data-del="${e.id}" aria-label="Delete entry">×</button></div>`}).join(""):`<div class="empty"><b>No entries yet</b>Pick an item above and save.</div>`;
  $$("#dayList [data-del]").forEach(b=>b.onclick=()=>{if(!confirm("Delete this entry?"))return;S.days[d]=S.days[d].filter(e=>e.id!==b.dataset.del);saveDay(d);renderDay();toast("Entry deleted")})}
function newItemQuick(name){eSugg.classList.remove("on");editItem(null,name,id=>{selectItem(id);$("#eQty").focus()})}

/* ---------- items ---------- */
function editItem(id,presetName,after){const i=id?itemById(id):{name:presetName||"",unit:"kg",cat:"Other",min:0,rate:0};
  openSheet(`<div class="hd"><h3>${id?"Edit item":"New item"}</h3><button class="x" data-close aria-label="Close">×</button></div>
  <label for="fN">Name</label><input id="fN" value="${esc(i.name)}">
  <div class="row"><div><label for="fU">Unit</label><select id="fU">${UNITS.map(u=>`<option ${u===i.unit?"selected":""}>${u}</option>`).join("")}</select></div>
  <div><label for="fM">Minimum level</label><input id="fM" type="number" inputmode="decimal" step="any" value="${i.min||""}" placeholder="0"></div></div>
  <label for="fC">Category</label><select id="fC">${CATS.map(c=>`<option ${c===i.cat?"selected":""}>${c}</option>`).join("")}</select>
  <label for="fR">Rate per unit (₹, for stock value)</label><input id="fR" type="number" inputmode="decimal" step="any" value="${i.rate||""}" placeholder="0">
  <div class="row" style="margin-top:16px">${id?'<button class="btn danger" id="fDel">Delete</button>':""}<button class="btn" id="fSave">Save item</button></div>`);
  $("#fSave").onclick=()=>{const name=$("#fN").value.trim();if(!name){toast("Enter a name");return}
    if(S.items.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==id)){toast("An item with this name exists");return}
    const o={id:id||uniqueId(name),name,unit:$("#fU").value,cat:$("#fC").value,min:+$("#fM").value||0,rate:+$("#fR").value||0};
    if(id)S.items=S.items.map(x=>x.id===id?o:x);else S.items.push(o);
    saveItems();closeSheet();toast("Item saved");refreshAll();after&&after(o.id)};
  if(id)$("#fDel").onclick=()=>{if(hasMoves(id)||S.opening.qty[id]!=null){if(!confirm("This item has stock entries. Delete it and hide its history?"))return}else if(!confirm("Delete this item?"))return;
    S.items=S.items.filter(x=>x.id!==id);delete S.opening.qty[id];saveItems();saveOpening();closeSheet();refreshAll();toast("Item deleted")}}
function uniqueId(name){let b=slug(name),id=b,n=2;while(itemById(id))id=b+"-"+n++;return id}
function openItems(){const list=S.items.slice().sort((a,b)=>a.name.localeCompare(b.name));
  openSheet(`<div class="hd"><h3>Items (${list.length})</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="row" style="margin-bottom:10px"><button class="btn small" id="iAdd">+ New item</button>${S.items.length?"":'<button class="btn ghost small" id="iSeed">Load KBD purchase items</button>'}</div>
  <input id="iQ" type="search" placeholder="Search…" style="margin-bottom:10px"><div class="list" id="iList"></div>`);
  const draw=()=>{const q=$("#iQ").value.toLowerCase();$("#iList").innerHTML=list.filter(i=>i.name.toLowerCase().includes(q)).map(i=>`<button class="it" data-id="${esc(i.id)}"><span class="nm"><b>${esc(i.name)}</b><span>${esc(i.cat)}${i.min?" · min "+num(i.min):""}${i.rate?" · "+inr(i.rate)+"/"+esc(i.unit):""}</span></span><span class="q"><span>${esc(i.unit)}</span> ›</span></button>`).join("")||`<div class="empty"><b>No items</b>Add one, or load the items from your KBD bills.</div>`;
    $$("#iList .it").forEach(x=>x.onclick=()=>editItem(x.dataset.id))};
  draw();$("#iQ").oninput=draw;$("#iAdd").onclick=()=>editItem(null);
  const sd=$("#iSeed");if(sd)sd.onclick=()=>{seedCatalog();closeSheet();openItems()}}
function seedCatalog(){let n=0;CATALOG.forEach(([name,unit,cat,rate])=>{if(!S.items.some(i=>i.name.toLowerCase()===name.toLowerCase())){S.items.push({id:uniqueId(name),name,unit,cat,min:0,rate});n++}});saveItems();refreshAll();toast(`${n} items added`)}

/* ---------- opening ---------- */
function openOpening(){const d=S.opening.date||today();
  openSheet(`<div class="hd"><h3>Opening stock</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="note">Enter the stock you counted at the end of the opening day. Balances are worked out from this date onward; entries before it are ignored.</div>
  <label for="oD">Opening date (balance as of end of this day)</label><input id="oD" type="date" value="${d}">
  <input id="oQ" type="search" placeholder="Search item…" style="margin-top:10px">
  <p class="small muted" style="margin:8px 0">Leave blank for items you don't keep. Tip: Setup → Paste a list is faster for a long list.</p>
  <div class="list opgrid" id="oList"></div>
  <button class="btn full" id="oSave" style="margin-top:12px">Save opening stock</button>`);
  const tmp={...S.opening.qty};
  const draw=()=>{const q=$("#oQ").value.toLowerCase();$("#oList").innerHTML=S.items.filter(i=>i.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="it"><span class="nm"><b>${esc(i.name)}</b><span>${esc(i.unit)}</span></span><input type="number" inputmode="decimal" step="any" data-id="${esc(i.id)}" value="${tmp[i.id]??""}" aria-label="${esc(i.name)} opening"></div>`).join("")||`<div class="empty"><b>No items yet</b>Add items first (Setup → Items).</div>`;
    $$("#oList input").forEach(x=>x.oninput=()=>{if(x.value==="")delete tmp[x.dataset.id];else tmp[x.dataset.id]=+x.value})};
  draw();$("#oQ").oninput=draw;
  $("#oSave").onclick=()=>{const nd=$("#oD").value;if(!nd){toast("Pick a date");return}
    const early=Object.keys(S.days).filter(x=>x<nd&&S.days[x].length).length;
    if(early&&!confirm(`${early} day(s) of entries are before ${fmtD(nd)} and will not count. Continue?`))return;
    S.opening={date:nd,qty:tmp};saveOpening();closeSheet();refreshAll();toast("Opening stock saved")}}

/* ---------- paste ---------- */
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,"")}
function matchItem(name){const n=norm(name);if(!n)return null;let m=S.items.find(i=>norm(i.name)===n);if(m)return m;
  m=S.items.filter(i=>norm(i.name).startsWith(n)||n.startsWith(norm(i.name)));if(m.length===1)return m[0];
  m=S.items.filter(i=>norm(i.name).includes(n));if(m.length===1)return m[0];const tk=name.toLowerCase().split(/[^a-z0-9\u0900-\u097f]+/).filter(x=>x.length>1);m=S.items.filter(i=>{const it=i.name.toLowerCase();return tk.length&&tk.every(w=>it.includes(w))});return m.length===1?m[0]:null}
function parseLines(txt){return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
  l=l.replace(/^\d+[\).\s]+(?=\D)/,"");
  const m=l.match(/^(.+?)[\s,:\-=\t|]+([\d.]+)\s*([a-zA-Z]*)\.?\s*$/);if(!m)return{raw:l,err:true};
  let q=+m[1+1],u=m[3].toLowerCase();if(u==="gm"||u==="g"||u==="gms"){q=q/1000;u="kg"}
  if(u==="ltr"||u==="lit"||u==="l"||u==="litre")u="L";if(u==="kgs")u="kg";
  return{raw:l,name:m[1].replace(/[,:\-=|\s]+$/,"").trim(),qty:q,unit:u}})}
function openPaste(){
  openSheet(`<div class="hd"><h3>Paste a list</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="seg" role="group" aria-label="List type" style="grid-template-columns:repeat(3,1fr)"><button class="adj" data-p="open" aria-pressed="true">Opening<small>सुरुवात</small></button><button class="in" data-p="in" aria-pressed="false">Stock In<small>आवक</small></button><button class="out" data-p="out" aria-pressed="false">Issue Out<small>जावक</small></button></div>
  <label for="pD">Date</label><input id="pD" type="date" value="${S.opening.date||today()}">
  <label for="pT">One item per line: name, quantity, unit</label>
  <textarea id="pT" placeholder="Basmati Rice, 45 kg&#10;Toor Dal 18 kg&#10;Sunflower Oil - 6 tin&#10;Jeera Powder 750 g"></textarea>
  <button class="btn ghost full" id="pChk" style="margin-top:10px">Check list</button>
  <div id="pPrev"></div>`);
  let pt="open";
  $$("#sheet .seg button").forEach(b=>b.onclick=()=>{pt=b.dataset.p;$$("#sheet .seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#pD").value=pt==="open"?(S.opening.date||today()):today()});
  $("#pChk").onclick=()=>{const rows=parseLines($("#pT").value);if(!rows.length){toast("Paste some lines first");return}
    rows.forEach(r=>{if(!r.err)r.item=matchItem(r.name)});
    const bad=rows.filter(r=>r.err).length,nw=rows.filter(r=>!r.err&&!r.item).length;
    $("#pPrev").innerHTML=`<p class="small" style="margin:12px 0 0"><b>${rows.length-bad}</b> lines read${nw?` · <b>${nw}</b> new items will be created`:""}${bad?` · <span style="color:var(--out)">${bad} lines not understood (skipped)</span>`:""}</p>
    <div class="list prev">${rows.map(r=>r.err?`<div class="entry"><span class="nm"><b style="color:var(--out)">${esc(r.raw)}</b><span>Could not find a quantity</span></span></div>`:`<div class="entry"><span class="nm"><b>${esc(r.item?r.item.name:r.name)}</b><span>${r.item?"Matched":'<span class="tag in">New item</span>'}${r.item&&r.unit&&r.unit!==r.item.unit.toLowerCase()&&r.unit.toLowerCase()!==r.item.unit.toLowerCase()?` · unit ${esc(r.unit)} ≠ ${esc(r.item.unit)}`:""}</span></span><span class="q">${num(r.qty)} ${esc(r.item?r.item.unit:(r.unit||"nos"))}</span></div>`).join("")}</div>
    <button class="btn full ${pt==="open"?"":pt}" id="pGo">${pt==="open"?"Save as opening stock":pt==="in"?"Save all as Stock In":"Save all as Issue Out"}</button>`;
    $("#pGo").onclick=()=>{const d=$("#pD").value||today();let added=0;
      rows.filter(r=>!r.err).forEach(r=>{let it=r.item;if(!it){const u=UNITS.find(x=>x.toLowerCase()===(r.unit||"").toLowerCase())||"kg";it={id:uniqueId(r.name),name:r.name,unit:u,cat:"Other",min:0,rate:0};S.items.push(it);added++}r.id=it.id});
      if(added)saveItems();
      if(pt==="open"){const merge=S.opening.date===d?{...S.opening.qty}:{};if(S.opening.date&&S.opening.date!==d&&!confirm(`Replace opening stock of ${fmtD(S.opening.date)} with this list for ${fmtD(d)}?`))return;
        rows.filter(r=>!r.err).forEach(r=>merge[r.id]=(r.qty));S.opening={date:d,qty:merge};saveOpening()}
      else{if(S.opening.date&&d<S.opening.date){toast("Date is before opening stock date");return}
        const arr=S.days[d]=S.days[d]||[];rows.filter(r=>!r.err).forEach(r=>arr.push({id:uid(),t:pt,item:r.id,qty:r.qty,note:"Pasted list",ts:Date.now()}));saveDay(d)}
      closeSheet();refreshAll();toast(`Saved ${rows.length-bad} lines${added?`, ${added} new items`:""}`)}}}

/* ---------- register ---------- */
function setRange(k){const t=today();let f=t,to=t;
  if(k==="yest"){f=to=addDays(t,-1)}else if(k==="week"){const d=new Date(t+"T00:00:00");const dow=(d.getDay()+6)%7;f=addDays(t,-dow)}else if(k==="month"){f=t.slice(0,8)+"01"}
  $("#rFrom").value=f;$("#rTo").value=to;renderReg()}
$$("[data-r]").forEach(b=>b.onclick=()=>setRange(b.dataset.r));
["rFrom","rTo","rMode"].forEach(id=>$("#"+id).addEventListener("change",renderReg));
function regData(){let f=$("#rFrom").value||today(),t=$("#rTo").value||f;if(t<f)[f,t]=[t,f];
  const od=S.opening.date;const startF=od&&f<od?od:f;
  const open=balances(addDays(startF,-1));if(od&&startF===od){}// opening day: balance before = opening qty minus that day's moves
  const openB={};const bEnd=balances(t);
  const moves={};let nIn=0,nOut=0;
  for(const e of entriesBetween(startF,t)){const m=moves[e.item]=moves[e.item]||{in:0,out:0,adj:0};if(e.t==="in"){m.in+=e.qty;nIn++}else if(e.t==="out"){m.out+=e.qty;nOut++}else m.adj+=e.diff||0}
  const rows=S.items.map(i=>{const m=moves[i.id]||{in:0,out:0,adj:0};const close=bEnd[i.id]||0;const op=close-m.in+m.out-m.adj;return{i,op,...m,close}});
  const mode=$("#rMode").value;
  const shown=rows.filter(r=>mode==="all"?(r.op||r.close||r.in||r.out||r.adj||S.opening.qty[r.i.id]!=null):mode==="low"?isLow(r.i,r.close):(r.in||r.out||r.adj)).sort((a,b)=>a.i.name.localeCompare(b.i.name));
  return{f:startF,t,shown,nIn,nOut}}
function renderReg(){if(!$("#rFrom").value){$("#rFrom").value=today();$("#rTo").value=today()}
  const {shown,nIn,nOut}=regData();$("#rIn").textContent=nIn;$("#rOut").textContent=nOut;$("#rN").textContent=shown.length;
  $("#rTable").innerHTML=`<tr><th>Item</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th></tr>`+(shown.length?shown.map(r=>`<tr><td>${esc(r.i.name)} <span class="muted small">${esc(r.i.unit)}</span>${r.adj?`<br><span class="tag adj">count ${r.adj>0?"+":""}${num(r.adj)}</span>`:""}</td><td>${num(r.op)}</td><td class="i">${r.in?num(r.in):"–"}</td><td class="o">${r.out?num(r.out):"–"}</td><td><b>${num(r.close)}</b></td></tr>`).join(""):`<tr><td colspan="5"><div class="empty"><b>Nothing to show</b>No stock moved in these dates. Try "All items".</div></td></tr>`)}
function csv(rows){return "\ufeff"+rows.map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n")}
async function download(name,text,type){const blob=new Blob([text],{type});
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){const buf=new Uint8Array(await blob.arrayBuffer());await dl.save({filename:name,data:buf});return}}catch(e){if(e&&e.code==="declined")return;if(e&&e.code&&e.code!=="unavailable"){toast("Download not available here");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
$("#rCsv").onclick=()=>{const {f,t,shown}=regData();download(`stock-register_${f}_to_${t}.csv`,csv([["Item","Unit","Opening","In","Out","Count adj.","Closing"],...shown.map(r=>[r.i.name,r.i.unit,r.op,r.in,r.out,r.adj,r.close])]),"text/csv")};

/* ---------- more ---------- */
$$("[data-open]").forEach(b=>b.onclick=()=>({opening:openOpening,paste:openPaste,items:openItems})[b.dataset.open]());
$("#mBal").onclick=()=>{const b=balances(today());download(`balance-stock_${today()}.csv`,csv([["Item","Category","Unit","Balance","Min level","Rate","Approx value"],...S.items.slice().sort((a,c)=>a.name.localeCompare(c.name)).map(i=>[i.name,i.cat,i.unit,b[i.id]||0,i.min||"",i.rate||"",i.rate?Math.round((b[i.id]||0)*i.rate):""])]),"text/csv")};
const bakText=()=>JSON.stringify({app:"magnus-store",v:1,saved:new Date().toISOString(),items:S.items,opening:S.opening,days:S.days});
const markBak=()=>{try{localStorage.setItem(LS+"-bak",today())}catch(e){}renderMore()};
$("#mBak").onclick=async()=>{await download(`magnus-store-backup_${today()}.json`,bakText(),"application/json");markBak()};
$("#mShare").onclick=async()=>{const name=`magnus-store-backup_${today()}.json`;const txt=bakText();
  try{const f=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Magnus Store backup",text:"Stock backup "+fmtD(today())});markBak();return}}catch(e){if(e&&e.name==="AbortError")return}
  await download(name,txt,"application/json");markBak();toast("Saved — now send the file from Downloads")};
$("#mCopy").onclick=()=>{const txt=bakText();
  openSheet(`<div class="hd"><h3>Backup text</h3><button class="x" data-close aria-label="Close">×</button></div>
  <p class="small muted">Copy all of this and paste it into WhatsApp (message yourself), Google Keep or an email to yourself. To restore, paste it back in Setup → Restore.</p>
  <textarea id="bkT" readonly style="min-height:180px;font-size:12px">${esc(txt)}</textarea>
  <button class="btn full" id="bkC" style="margin-top:10px">Copy</button>`);
  $("#bkC").onclick=async()=>{const ta=$("#bkT");ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}
    if(ok){markBak();toast("Copied — paste it in WhatsApp or Keep")}else toast("Text is selected — long-press and tap Copy")}};
function restoreFrom(o){if(!o||!Array.isArray(o.items))throw 0;
  if(!confirm(`Replace everything here with the backup from ${o.saved?fmtD(o.saved.slice(0,10)):"this file"}?`))return false;
  const oldDays=Object.keys(S.days);S={items:o.items,opening:o.opening||{date:"",qty:{}},days:o.days||{}};
  saveItems();saveOpening();new Set([...oldDays,...Object.keys(S.days)]).forEach(d=>{if(!S.days[d])S.days[d]=[];saveDay(d)});refreshAll();toast("Backup restored");return true}
$("#mRes").onclick=()=>{openSheet(`<div class="hd"><h3>Restore backup</h3><button class="x" data-close aria-label="Close">×</button></div>
  <button class="btn ghost full" id="rsF">Choose backup file (.json)</button>
  <label for="rsT">…or paste backup text</label><textarea id="rsT" placeholder='{"app":"magnus-store", …}'></textarea>
  <button class="btn full" id="rsGo" style="margin-top:10px">Restore pasted text</button>`);
  $("#rsF").onclick=()=>{closeSheet();$("#resFile").click()};
  $("#rsGo").onclick=()=>{try{if(restoreFrom(JSON.parse($("#rsT").value.trim())))closeSheet()}catch(e){toast("That text is not a Magnus Store backup")}}};
$("#resFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{restoreFrom(JSON.parse(await f.text()))}catch(err){toast("That file is not a Magnus Store backup")}e.target.value=""};
function renderMore(){$("#opInfo").textContent=S.opening.date?`${fmtD(S.opening.date)} · ${Object.keys(S.opening.qty).length} items`:"Not set yet — start here";
  $("#itInfo").textContent=`${S.items.length} items · add, rename, set minimum level`;
  let lb="";try{lb=localStorage.getItem(LS+"-bak")||""}catch(e){}
  $("#bakInfo").textContent=lb?"Last backup "+fmtD(lb):"No backup taken yet";
  $("#storeInfo").textContent=mode==="cloud"?"Saved to your account — open this same link on any phone to see the same stock.":"Saved on this phone's browser only. Download a backup regularly.";}

function refreshAll(){renderStock();renderDay();if($("#v-reg").classList.contains("on"))renderReg();renderMore()}

/* ---------- boot ---------- */
loadLocal();
if(!S.items.length){S.items=CATALOG.map(([name,unit,cat,rate])=>({id:slug(name),name,unit,cat,min:0,rate}))}
$("#eDate").value=today();setType("in");refreshAll();
$("#sync").textContent="On this phone";
(async()=>{
  if(!(window.claude&&window.claude.use))return;
  let d=null,u=null;try{[d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  if(!d)return;
  db=d;mode="cloud";$("#sync").textContent="Syncing…";
  const local=JSON.parse(JSON.stringify(S));let first={items:true,opening:true,days:true};
  db.doc("store/items").onSnapshot(s=>{if(s.exists){S.items=s.data().list||[]}else if(first.items){saveItems()}first.items=false;saveLocal();refreshAll();$("#sync").textContent="Synced"},err=>{$("#sync").textContent="Offline"});
  db.doc("store/opening").onSnapshot(s=>{if(s.exists){const o=s.data();S.opening={date:o.date||"",qty:o.qty||{}}}else if(first.opening&&local.opening.date){saveOpening()}first.opening=false;saveLocal();refreshAll()},()=>{});
  db.collection("store/main/days").onSnapshot(q=>{const nd={};q.docs.forEach(x=>{const o=x.data();nd[x.id]=o.entries||[]});
    if(first.days&&q.empty&&Object.keys(local.days).length){S.days=local.days;Object.keys(S.days).forEach(saveDay)}else S.days=nd;first.days=false;saveLocal();refreshAll()},()=>{$("#sync").textContent="Offline"});
})();
</script>
</body></html>
